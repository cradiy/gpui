[workspace]
resolver = "2"
members = [
  "crates/collections",
  "crates/gpui",
  "crates/gpui_automation",
  "crates/gpui_media",
  "crates/gpui_media_core",
  "crates/gpui_media_backend",
  "crates/gpui_shared_string",
  "crates/gpui_linux",
  "crates/gpui_wayland_source",
  "crates/gpui_macos",
  "crates/gpui_macros",
  "crates/gpui_platform",
  "crates/gpui_tokio",
  "crates/gpui_util",
  "crates/gpui_web",
  "crates/gpui_wgpu",
  "crates/scheduler",
  "crates/sum_tree",
  "crates/gpui_windows",
  "crates/http_client",
  "crates/http_client_tls",
  "crates/media",
  "crates/util_macros",
  "crates/refineable",
  "crates/refineable/derive_refineable",
  "crates/reqwest_client",
  "crates/gpui_effects",
  "crates/gpui_3d",
  "crates/gpui_3d_effects",
  "crates/gpui_3d_gltf",
  "uic",
  "uic/macros",
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# Workspace member crates
#

collections = { path = "crates/collections", version = "0.1.0" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
gpui = { path = "crates/gpui", default-features = false }
gpui_automation = { path = "crates/gpui_automation" }
gpui_media = { path = "crates/gpui_media" }
gpui_media_core = { path = "crates/gpui_media_core" }
gpui_media_backend = { path = "crates/gpui_media_backend" }
gpui_shared_string = { path = "crates/gpui_shared_string" }
gpui_linux = { path = "crates/gpui_linux", default-features = false }
gpui_wayland_source = { path = "crates/gpui_wayland_source" }
gpui_macos = { path = "crates/gpui_macos", default-features = false }
gpui_macros = { path = "crates/gpui_macros" }
gpui_effects = { path = "crates/gpui_effects" }
gpui_3d = { path = "crates/gpui_3d" }
gpui_3d_effects = { path = "crates/gpui_3d_effects" }
gpui_3d_gltf = { path = "crates/gpui_3d_gltf" }
gpui_platform = { path = "crates/gpui_platform", default-features = false }
gpui_web = { path = "crates/gpui_web" }
gpui_wgpu = { path = "crates/gpui_wgpu" }
gpui_windows = { path = "crates/gpui_windows", default-features = false }
gpui_tokio = { path = "crates/gpui_tokio" }
gpui_util = { path = "crates/gpui_util" }
http_client = { path = "crates/http_client" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }
http_client_tls = { path = "crates/http_client_tls" }
media = { path = "crates/media" }
naga = { version = "29.0.4", features = ["wgsl-in", "msl-out", "hlsl-out"] }
util_macros = { path = "crates/util_macros" }
uic_macros = { package = "uic-macros", path = "uic/macros", version = "0.1.0" }
refineable = { path = "crates/refineable" }
reqwest_client = { path = "crates/reqwest_client" }



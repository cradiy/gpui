[package]
name = "gpui_3d"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"

[features]
test-support = ["gpui/test-support"]
wgpu = ["dep:gpui_wgpu", "dep:bytemuck"]

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"], optional = true }
bevy_mikktspace.workspace = true
gpui.workspace = true
gpui_wgpu = { workspace = true, optional = true }
slotmap.workspace = true

[dev-dependencies]
criterion.workspace = true
gpui_effects.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
image.workspace = true
uic = { path = "../../uic" }

[[example]]
name = "headless"
required-features = ["wgpu"]

[[bench]]
name = "scene"
harness = false

[[bench]]
name = "deformation"
harness = false

[lints]
workspace = true

[package]
name = "gpui_media"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "MIT"

[features]
default = ["audio", "video"]
audio = ["dep:base64", "dep:cpal", "dep:symphonia", "dep:ureq"]
video = []

[dependencies]
async-channel.workspace = true
base64 = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gpui.workspace = true
log.workspace = true
symphonia = { version = "0.6.0", default-features = false, features = [
  "all-codecs",
  "all-meta",
  "all-formats",
], optional = true }
ureq = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["wayland", "x11", "font-kit"] }

[[example]]
name = "audio"
required-features = ["audio"]

[[test]]
name = "custom_backend"
required-features = ["video"]

[lints]
workspace = true

[package]
name = "gpui_3d_effects"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"
description = "Reusable spatial effects for GPUI interfaces"

[features]
default = ["wgpu"]
wgpu = ["gpui_3d/wgpu", "dep:anyhow"]

[dependencies]
anyhow = { workspace = true, optional = true }
gpui.workspace = true
gpui_3d.workspace = true

[dev-dependencies]
anyhow.workspace = true
gpui_3d = { workspace = true, features = ["wgpu"] }
gpui_effects.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[[example]]
name = "floating"
required-features = ["wgpu"]

[[example]]
name = "curve_light"
required-features = ["wgpu"]

[lints]
workspace = true
